name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ESLint and Prettier need no install scripts; the build-and-test job below runs them.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts run here so CI also verifies the native/optional
      # dependencies (esbuild, fsevents).
      - name: Install
        run: npm ci

      # Electron 44+ has no install script: it downloads its binary lazily on
      # first require. Neither the build nor Jest needs it, so fetch it here
      # to keep catching download failures on every platform.
      - name: Fetch Electron binary
        run: npx --no install-electron

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Packages the app as it ships, Electron fuses and all, but without the
  # installers, then checks its fuses and that it starts and renders. See
  # scripts/smoke-packaged-app.js.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # CI has no signing identity, so electron-builder need not look for one.
      - name: Package
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Ubuntu 24.04 stops unprivileged processes from creating the user
      # namespaces Chromium's sandbox runs in, and an unpacked build has no
      # setuid chrome-sandbox to fall back on.
      - name: Allow user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Linux runners have no display, so the app gets a virtual one.
      - name: Smoke-test the packaged app
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} node scripts/smoke-packaged-app.js

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ESLint and Prettier need no install scripts; the build-and-test job below runs them.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts run here so CI also verifies the native/optional
      # dependencies (esbuild, fsevents).
      - name: Install
        run: npm ci

      # Electron 44+ has no install script: it downloads its binary lazily on
      # first require. Neither the build nor Jest needs it, so fetch it here
      # to keep catching download failures on every platform.
      - name: Fetch Electron binary
        run: npx --no install-electron

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
